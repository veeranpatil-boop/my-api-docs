openapi: 3.0.3
info:
  title: My Sample API
  version: 1.0.0
  description: A simple demo API for learning API documentation
servers:
  - url: https://api.example.com/v1
paths:
  /tasks:
    get:
      summary: List all tasks
      description: Returns a list of all tasks
      responses:
        '200':
          description: A list of tasks
    get:
      summary: List all open tasks
      description: Returns a list of all open tasks
      responses:
        '200':
          description: A list of open tasks
    post:
      summary: Create a new task
      description: Adds a new task to the list
      responses:
        '201':
          description: Task created successfully
  /tasks/{taskId}:
    get:
      summary: Get a single task
      description: Returns details of one specific task
      parameters:
        - name: taskId
          in: path
          required: true
          description: The ID of the task to retrieve
          schema:
            type: string
      responses:
        '200':
          description: Task details
        '404':
          description: Task not found
    delete:
      summary: Delete a task
      description: Removes a specific task from the list
      parameters:
        - name: taskId
          in: path
          required: true
          description: The ID of the task to delete
          schema:
            type: string
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found