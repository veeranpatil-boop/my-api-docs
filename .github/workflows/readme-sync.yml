name: Sync API docs to ReadMe

on:
  push:
    branches:
      - main

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync OpenAPI spec to ReadMe
        run: npx rdme@10 openapi upload ./openapi.yaml --key=${{ secrets.README_API_KEY }}